services:
  postgres:
    image: postgres:15-alpine
    container_name: apicanary-db
    environment:
      POSTGRES_USER: apicanary
      POSTGRES_PASSWORD: apicanary
      POSTGRES_DB: apicanary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apicanary"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apicanary-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: python:3.10-slim
    container_name: apicanary-api
    command: sh -c "pip install -r requirements.txt && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    working_dir: /app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://apicanary:apicanary@postgres:5432/apicanary
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    image: python:3.10-slim
    container_name: apicanary-celery
    command: sh -c "pip install -r requirements.txt && celery -A app.tasks.celery worker --loglevel=info"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    working_dir: /app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://apicanary:apicanary@postgres:5432/apicanary
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    image: python:3.10-slim
    container_name: apicanary-beat
    command: sh -c "pip install -r requirements.txt && celery -A app.tasks.celery beat --loglevel=info"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    working_dir: /app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://apicanary:apicanary@postgres:5432/apicanary
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - postgres

  frontend:
    image: node:20-alpine
    container_name: apicanary-web
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    working_dir: /app
    environment:
      - WATCHPACK_POLLING=true
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
