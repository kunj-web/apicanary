name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: apicanary
          POSTGRES_PASSWORD: apicanary
          POSTGRES_DB: apicanary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apicanary -d apicanary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://apicanary:apicanary@127.0.0.1:5432/apicanary_test
      REDIS_URL: redis://127.0.0.1:6379/0
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-thirty-two-characters
      MONITOR_ENCRYPTION_KEY: ci-only-monitor-key-that-is-longer-than-thirty-two
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: test
      SMTP_PASSWORD: test
      ALERT_FROM_EMAIL: alerts@example.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint backend
        run: python -m ruff check app tests migrations
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Validate migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: apicanary
          POSTGRES_PASSWORD: apicanary
          POSTGRES_DB: apicanary_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apicanary -d apicanary_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://apicanary:apicanary@127.0.0.1:5432/apicanary_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
      BACKEND_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
      ENVIRONMENT: test
      COOKIE_SECURE: "false"
      TRUSTED_ORIGINS: http://127.0.0.1:3000
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-thirty-two-characters
      MONITOR_ENCRYPTION_KEY: ci-only-monitor-key-that-is-longer-than-thirty-two
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: test
      SMTP_PASSWORD: test
      ALERT_FROM_EMAIL: alerts@example.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Prepare database and frontend
        run: |
          cd backend
          python -m alembic upgrade head
          cd ../frontend
          npm run build
      - name: Start backend
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - name: Run browser journey
        working-directory: frontend
        run: npm run test:e2e
